name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      - run: npx esbuild netlify/functions/api.mts --bundle --platform=node --format=esm --outfile=/tmp/api-check.mjs
      - name: hunter_revenge guard
        run: test "$(grep -rn "hunter_revenge" src server.ts | wc -l)" -le 2
      - name: vi + en only guard
        run: test "$(grep -rnE "['\"](fr|es|ja)['\"]" src | wc -l)" -eq 0

  e2e:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/

